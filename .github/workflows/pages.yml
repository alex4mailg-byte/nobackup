name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    # Раз в неделю, понедельник 04:40 UTC (07:40 МСК). Не чаще — и вот почему.
    # Расписание здесь страховка на случай «опубликовал и забыл», а не
    # основной путь: обычно автор жмёт Run workflow сразу после публикации.
    # Книга меняется раз в месяц; опрашивать её ежедневно значит тридцать
    # раз спросить об одном и том же. И отдельно: Zenodo сейчас лежит именно
    # под автоматическим трафиком — ежедневный опрос был бы вкладом в ту же беду.
    - cron: '40 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZENODO_CONCEPT: '22336634'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      propusk: ${{ steps.zenodo.outputs.propusk }}
    steps:
      - uses: actions/checkout@v4

      # --- Свежая ревизия с Zenodo -----------------------------------------
      # Три случая разведены намеренно, потому что они разного рода:
      #   Zenodo не ответил, прогон ночной  → тихий пропуск, сборки нет,
      #       письма нет. Это не ошибка в книге, а отсутствие повода пересобрать.
      #   Zenodo не ответил, нажата кнопка  → падение. Вы просили собрать сейчас.
      #   Zenodo ответил, сумма не сошлась  → падение всегда. Это порча.
      # Тревога, срабатывающая впустую, хуже отсутствующей: к третьему письму
      # её перестают открывать, и настоящая порча проходит незамеченной.
      - name: Взять свежую ревизию с Zenodo
        id: zenodo
        run: |
          set -eu
          mkdir -p kniga
          if [ "${{ github.event_name }}" = "push" ] && [ -f kniga/kniga.md ]; then
            echo "push, и книга в репозитории есть — Zenodo не трогаем"
            exit 0
          fi

          nedostupen() {
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::notice::Zenodo недоступен. Ночной прогон пропущен, сайт остаётся прежним."
              echo "propusk=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Zenodo недоступен, а прогон запрошен вручную. $1"
            exit 1
          }

          API="https://zenodo.org/api/records/${ZENODO_CONCEPT}/versions/latest"
          curl -sSfL --retry 5 --retry-delay 15 --retry-all-errors --retry-max-time 120 \
               -H 'Accept: application/json' "$API" -o zenodo.json \
            || nedostupen "Не отвечает API записи."

          python3 - <<'PY'
          import json, sys
          d = json.load(open('zenodo.json'))
          md = [f for f in d['files'] if f['key'].lower().endswith('.md')]
          if len(md) != 1:
              sys.exit('ОСТАНОВ: файлов .md в записи %d, ожидался ровно один' % len(md))
          f = md[0]
          with open('zenodo.env', 'w') as o:
              o.write('URL=%s\n'  % f['links']['self'])
              o.write('SIZE=%s\n' % f['size'])
              o.write('SUM=%s\n'  % f['checksum'].replace('md5:', ''))
          print('ревизия на Zenodo:', d['metadata'].get('version'),
                '| файл:', f['key'], f['size'], f['checksum'])
          PY

          . ./zenodo.env
          curl -sSfL --retry 5 --retry-delay 15 --retry-all-errors --retry-max-time 180 \
               "$URL" -o svezhaya.md \
            || nedostupen "Запись прочитана, но файл не скачался."

          # Сверка до сборки. Обрыв связи даёт усечённый файл, который нарежется
          # без единой ошибки. Здесь падаем ВСЕГДА, при любом поводе: это порча,
          # а не недоступность.
          if [ "$(stat -c%s svezhaya.md)" != "$SIZE" ]; then
            echo "::error::Размер $(stat -c%s svezhaya.md), ожидался $SIZE. Файл усечён."
            exit 1
          fi
          echo "$SUM  svezhaya.md" | md5sum -c - \
            || { echo "::error::Контрольная сумма не сошлась. Файл испорчен."; exit 1; }

          mv svezhaya.md kniga/kniga.md
          echo "книга взята с Zenodo и сверена"

      - name: Что собираем
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          echo "повод: ${{ github.event_name }}"
          ls -l kniga/kniga.md; md5sum kniga/kniga.md
          grep -m1 -oP 'Ревизия \d+\. [^*]*' kniga/kniga.md || true

      - name: Нарезка
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          set -eu
          rm -rf src && mkdir -p src
          python3 kniga/narezka.py kniga/kniga.md src

      - name: Проверка нарезки
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          set -eu
          test -f src/SUMMARY.md
          test -f src/CNAME
          test -f src/title.md
          N=$(ls src/*.md | wc -l)
          echo "страниц нарезано: $N"
          test "$N" -ge 30
          R1=$(grep -oP 'Ревизия \d+' src/title.md | head -1)
          R2=$(grep -oP 'Ревизия \d+' src/93-vyhodnye-dannye.md | head -1)
          echo "титул: $R1 / выходные данные: $R2"
          test "$R1" = "$R2" \
            || { echo "::error::Номер ревизии на титуле и в выходных данных разный"; exit 1; }

      - name: Install mdBook
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          curl -sSL -o mdbook.tar.gz https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz
          tar xzf mdbook.tar.gz
          sudo mv mdbook /usr/local/bin/
      - name: Build большая книга
        if: steps.zenodo.outputs.propusk != 'true'
        run: mdbook build
      - name: Build малая книга «Носители»
        if: steps.zenodo.outputs.propusk != 'true'
        run: mdbook build nositeli
      - name: Собрать малую книгу в подкаталог /nositeli/
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          mkdir -p book/nositeli
          cp -r nositeli/book/. book/nositeli/
      - name: Русский поиск в обеих книгах
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          cp searcher-ru.js book/searcher.js
          cp searcher-ru.js book/nositeli/searcher.js

      # --- Титульная страница: заголовок вкладки и канонический адрес -------
      # Две беды, обе видны только поисковику и обе только на титуле.
      #
      # Первая. mdBook складывает <title> из имени главы и имени книги. На
      # титульной странице они совпадают, и выходит «Резервной копии нет —
      # Резервной копии нет». Именно эту строку поиск показывает заголовком
      # результата. Заранее заданного названия здесь НЕ подставляется: оно
      # завелось бы вторым местом, которое надо не забыть при переименовании
      # книги, — а переименование уже случалось. Берутся первые два
      # предложения описания той же страницы: описание правится в head.hbs,
      # там же, где автор правит такие слова.
      #
      # Вторая. Титул отдаётся по двум адресам, /title.html и /, с одним и тем
      # же содержимым. Для поиска это дубль. Ставится canonical — но ТОЛЬКО на
      # эти две страницы. Общий canonical в head.hbs уже был однажды поставлен
      # и указывал все страницы сайта на главную, то есть прямо запрещал
      # индексировать книгу. Повторять этого нельзя.
      - name: Заголовок вкладки и канонический адрес титула
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          set -eu
          python3 - <<'PY'
          import os, re, sys

          BAZA = 'https://nobackup.org'
          PARY = [('book',          BAZA + '/'),
                  ('book/nositeli', BAZA + '/nositeli/')]

          for katalog, adres in PARY:
              zagolovok = None
              for imya in ('index.html', 'title.html'):
                  put = os.path.join(katalog, imya)
                  if not os.path.exists(put):
                      sys.exit('ОСТАНОВ: нет %s' % put)
                  t = open(put, encoding='utf-8').read()

                  if zagolovok is None:
                      m = re.search(r'<title>(.*?)</title>', t, re.S)
                      if not m:
                          sys.exit('ОСТАНОВ: в %s нет <title>' % put)
                      celikom = m.group(1).strip()
                      chasti = [c.strip() for c in celikom.split(' - ')]
                      if len(chasti) == 2 and chasti[0].lower() == chasti[1].lower():
                          d = re.search(r'<meta name="description" content="([^"]*)"', t)
                          kuski = [k.strip() for k in (d.group(1) if d else '').split('.')
                                   if k.strip()]
                          novyy = '. '.join(kuski[:2])
                          if not (10 <= len(novyy) <= 70):
                              novyy = chasti[1]
                              print('::notice::описание в заголовок не годится, взято «%s»'
                                    % novyy)
                          zagolovok = novyy
                      else:
                          zagolovok = celikom
                          print('удвоения нет, заголовок оставлен:', celikom)

                  t = re.sub(r'<title>.*?</title>', '<title>%s</title>' % zagolovok,
                             t, count=1, flags=re.S)
                  if 'rel="canonical"' not in t:
                      t = t.replace('</title>',
                                    '</title>\n    <link rel="canonical" href="%s">' % adres,
                                    1)
                  open(put, 'w', encoding='utf-8').write(t)

                  # Проверяется результат, а не код возврата.
                  p = open(put, encoding='utf-8').read()
                  if '<title>%s</title>' % zagolovok not in p:
                      sys.exit('ОСТАНОВ: заголовок не записан в %s' % put)
                  if p.count('rel="canonical"') != 1:
                      sys.exit('ОСТАНОВ: canonical в %s встречается %d раз'
                               % (put, p.count('rel="canonical"')))
                  print(put, '→ <title>%s</title> | canonical %s' % (zagolovok, adres))
          PY

      - name: Карта сайта и robots.txt
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          set -eu
          python3 - <<'PY'
          import os, datetime
          BAZA = 'https://nobackup.org'
          segodnya = datetime.date.today().isoformat()
          # title.html — тот же титул, что и «/». В карту идёт один адрес из двух,
          # тот, на который указывает canonical.
          PROPUSK = {'404.html', 'print.html', 'toc.html', 'title.html'}
          adresa = []
          for koren, _, fayly in os.walk('book'):
              for f in fayly:
                  if not f.endswith('.html') or f in PROPUSK:
                      continue
                  p = os.path.relpath(os.path.join(koren, f), 'book').replace(os.sep, '/')
                  if p == 'index.html':
                      p = ''
                  elif p.endswith('/index.html'):
                      p = p[:-len('index.html')]
                  adresa.append(BAZA + '/' + p)
          adresa = sorted(set(adresa))
          with open('book/sitemap.xml', 'w', encoding='utf-8') as o:
              o.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              o.write('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n')
              for a in adresa:
                  o.write('  <url><loc>%s</loc><lastmod>%s</lastmod></url>\n' % (a, segodnya))
              o.write('</urlset>\n')
          open('book/robots.txt', 'w', encoding='utf-8').write(
              'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' % BAZA)
          print('адресов в карте сайта:', len(adresa))
          # Порог, а не украшение: если mdBook однажды соберёт полкниги,
          # карта сайта сообщит об этом падением, а не тихо обеднеет.
          if len(adresa) < 40:
              raise SystemExit('ОСТАНОВ: адресов %d, ожидалось не меньше сорока' % len(adresa))
          PY

      - name: Проверка сборки
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          test -f book/index.html
          test -f book/nositeli/index.html
          test -f book/CNAME
          test ! -f book/nositeli/CNAME
          test -f book/sitemap.xml
          test -f book/robots.txt
          grep -q "Unicode" book/searcher.js
          grep -q "Unicode" book/nositeli/searcher.js
          # Титул: canonical стоит, удвоенного заголовка нет, дубля в карте нет.
          grep -q 'rel="canonical"' book/index.html
          grep -q 'rel="canonical"' book/nositeli/index.html
          ! grep -q 'rel="canonical"' book/gl-01.html
          ! grep -q '<loc>https://nobackup.org/title.html</loc>' book/sitemap.xml
          ! grep -q '<loc>https://nobackup.org/nositeli/title.html</loc>' book/sitemap.xml
          echo "страниц большой: $(ls book/*.html | wc -l), малой: $(ls book/nositeli/*.html | wc -l)"
      - uses: actions/configure-pages@v5
        if: steps.zenodo.outputs.propusk != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.zenodo.outputs.propusk != 'true'
        with:
          path: book

  deploy:
    needs: build
    if: needs.build.outputs.propusk != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
