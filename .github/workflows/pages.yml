name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    # Раз в неделю, понедельник 04:40 UTC (07:40 МСК). Не чаще — и вот почему.
    # Расписание здесь страховка на случай «опубликовал и забыл», а не
    # основной путь: обычно автор жмёт Run workflow сразу после публикации.
    # Книга меняется раз в месяц; опрашивать её ежедневно значит тридцать
    # раз спросить об одном и том же. И отдельно: Zenodo сейчас лежит именно
    # под автоматическим трафиком — ежедневный опрос был бы вкладом в ту же беду.
    - cron: '40 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZENODO_CONCEPT: '22336634'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      propusk: ${{ steps.zenodo.outputs.propusk }}
    steps:
      - uses: actions/checkout@v4

      # --- Свежая ревизия с Zenodo -----------------------------------------
      # Три случая разведены намеренно, потому что они разного рода:
      #   Zenodo не ответил, прогон ночной  → тихий пропуск, сборки нет,
      #       письма нет. Это не ошибка в книге, а отсутствие повода пересобрать.
      #   Zenodo не ответил, нажата кнопка  → падение. Вы просили собрать сейчас.
      #   Zenodo ответил, сумма не сошлась  → падение всегда. Это порча.
      # Тревога, срабатывающая впустую, хуже отсутствующей: к третьему письму
      # её перестают открывать, и настоящая порча проходит незамеченной.
      - name: Взять свежую ревизию с Zenodo
        id: zenodo
        run: |
          set -eu
          mkdir -p kniga
          if [ "${{ github.event_name }}" = "push" ] && [ -f kniga/kniga.md ]; then
            echo "push, и книга в репозитории есть — Zenodo не трогаем"
            exit 0
          fi

          nedostupen() {
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::notice::Zenodo недоступен. Ночной прогон пропущен, сайт остаётся прежним."
              echo "propusk=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Zenodo недоступен, а прогон запрошен вручную. $1"
            exit 1
          }

          API="https://zenodo.org/api/records/${ZENODO_CONCEPT}/versions/latest"
          curl -sSfL --retry 5 --retry-delay 15 --retry-all-errors --retry-max-time 120 \
               -H 'Accept: application/json' "$API" -o zenodo.json \
            || nedostupen "Не отвечает API записи."

          python3 - <<'PY'
          import json, sys
          d = json.load(open('zenodo.json'))
          md = [f for f in d['files'] if f['key'].lower().endswith('.md')]
          if len(md) != 1:
              sys.exit('ОСТАНОВ: файлов .md в записи %d, ожидался ровно один' % len(md))
          f = md[0]
          with open('zenodo.env', 'w') as o:
              o.write('URL=%s\n'  % f['links']['self'])
              o.write('SIZE=%s\n' % f['size'])
              o.write('SUM=%s\n'  % f['checksum'].replace('md5:', ''))
          print('ревизия на Zenodo:', d['metadata'].get('version'),
                '| файл:', f['key'], f['size'], f['checksum'])
          PY

          . ./zenodo.env
          curl -sSfL --retry 5 --retry-delay 15 --retry-all-errors --retry-max-time 180 \
               "$URL" -o svezhaya.md \
            || nedostupen "Запись прочитана, но файл не скачался."

          # Сверка до сборки. Обрыв связи даёт усечённый файл, который нарежется
          # без единой ошибки. Здесь падаем ВСЕГДА, при любом поводе: это порча,
          # а не недоступность.
          if [ "$(stat -c%s svezhaya.md)" != "$SIZE" ]; then
            echo "::error::Размер $(stat -c%s svezhaya.md), ожидался $SIZE. Файл усечён."
            exit 1
          fi
          echo "$SUM  svezhaya.md" | md5sum -c - \
            || { echo "::error::Контрольная сумма не сошлась. Файл испорчен."; exit 1; }

          mv svezhaya.md kniga/kniga.md
          echo "книга взята с Zenodo и сверена"

      - name: Что собираем
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          echo "повод: ${{ github.event_name }}"
          ls -l kniga/kniga.md; md5sum kniga/kniga.md
          grep -m1 -oP 'Ревизия \d+\. [^*]*' kniga/kniga.md || true

      - name: Нарезка
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          set -eu
          rm -rf src && mkdir -p src
          python3 kniga/narezka.py kniga/kniga.md src

      - name: Проверка нарезки
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          set -eu
          test -f src/SUMMARY.md
          test -f src/CNAME
          test -f src/title.md
          N=$(ls src/*.md | wc -l)
          echo "страниц нарезано: $N"
          test "$N" -ge 30
          R1=$(grep -oP 'Ревизия \d+' src/title.md | head -1)
          R2=$(grep -oP 'Ревизия \d+' src/93-vyhodnye-dannye.md | head -1)
          echo "титул: $R1 / выходные данные: $R2"
          test "$R1" = "$R2" \
            || { echo "::error::Номер ревизии на титуле и в выходных данных разный"; exit 1; }

      - name: Install mdBook
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          curl -sSL -o mdbook.tar.gz https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz
          tar xzf mdbook.tar.gz
          sudo mv mdbook /usr/local/bin/
      - name: Build большая книга
        if: steps.zenodo.outputs.propusk != 'true'
        run: mdbook build
      - name: Build малая книга «Носители»
        if: steps.zenodo.outputs.propusk != 'true'
        run: mdbook build nositeli
      - name: Собрать малую книгу в подкаталог /nositeli/
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          mkdir -p book/nositeli
          cp -r nositeli/book/. book/nositeli/
      - name: Русский поиск в обеих книгах
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          cp searcher-ru.js book/searcher.js
          cp searcher-ru.js book/nositeli/searcher.js

      - name: Главная страница книги
        if: steps.zenodo.outputs.propusk != 'true'
        run: python3 landing/build.py

      # --- Титульная страница: заголовок вкладки и канонический адрес -------
      # Две беды, обе видны только поисковику и обе только на титуле.
      #
      # Первая. mdBook складывает <title> из имени главы и имени книги. На
      # титульной странице они совпадают, и выходит «Резервной копии нет —
      # Резервной копии нет». Именно эту строку поиск показывает заголовком
      # результата. Заранее заданного названия здесь НЕ подставляется: оно
      # завелось бы вторым местом, которое надо не забыть при переименовании
      # книги, — а переименование уже случалось. Берутся первые два
      # предложения описания той же страницы: описание правится в head.hbs,
      # там же, где автор правит такие слова.
      #
      # Вторая. Титул отдаётся по двум адресам, /title.html и /, с одним и тем
      # же содержимым. Для поиска это дубль. Ставится canonical — но ТОЛЬКО на
      # эти две страницы. Общий canonical в head.hbs уже был однажды поставлен
      # и указывал все страницы сайта на главную, то есть прямо запрещал
      # индексировать книгу. Повторять этого нельзя.
      - name: Заголовок вкладки и канонический адрес титула
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          set -eu
          python3 - <<'PY'
          import os, re, sys

          BAZA = 'https://nobackup.org'
          PARY = [('book',          BAZA + '/'),
                  ('book/nositeli', BAZA + '/nositeli/')]

          for katalog, adres in PARY:
              zagolovok = None
              for imya in ('index.html', 'title.html'):
                  put = os.path.join(katalog, imya)
                  if not os.path.exists(put):
                      sys.exit('ОСТАНОВ: нет %s' % put)
                  t = open(put, encoding='utf-8').read()

                  if zagolovok is None:
                      m = re.search(r'<title>(.*?)</title>', t, re.S)
                      if not m:
                          sys.exit('ОСТАНОВ: в %s нет <title>' % put)
                      celikom = m.group(1).strip()
                      chasti = [c.strip() for c in celikom.split(' - ')]
                      if len(chasti) == 2 and chasti[0].lower() == chasti[1].lower():
                          d = re.search(r'<meta name="description" content="([^"]*)"', t)
                          kuski = [k.strip() for k in (d.group(1) if d else '').split('.')
                                   if k.strip()]
                          novyy = '. '.join(kuski[:2])
                          if not (10 <= len(novyy) <= 70):
                              novyy = chasti[1]
                              print('::notice::описание в заголовок не годится, взято «%s»'
                                    % novyy)
                          zagolovok = novyy
                      else:
                          zagolovok = celikom
                          print('удвоения нет, заголовок оставлен:', celikom)

                  t = re.sub(r'<title>.*?</title>', '<title>%s</title>' % zagolovok,
                             t, count=1, flags=re.S)
                  if 'rel="canonical"' not in t:
                      t = t.replace('</title>',
                                    '</title>\n    <link rel="canonical" href="%s">' % adres,
                                    1)
                  open(put, 'w', encoding='utf-8').write(t)

                  # Проверяется результат, а не код возврата.
                  p = open(put, encoding='utf-8').read()
                  if '<title>%s</title>' % zagolovok not in p:
                      sys.exit('ОСТАНОВ: заголовок не записан в %s' % put)
                  if p.count('rel="canonical"') != 1:
                      sys.exit('ОСТАНОВ: canonical в %s встречается %d раз'
                               % (put, p.count('rel="canonical"')))
                  print(put, '→ <title>%s</title> | canonical %s' % (zagolovok, adres))
          PY

      # --- Своё описание каждой странице -----------------------------------
      # Было: все страницы несли одно описание — аннотацию книги целиком из
      # theme/head.hbs. Глава «Порог Эйгена» представлялась поисковику теми же
      # словами, что список литературы. Это и упущенная возможность (описание —
      # второй по силе сигнал о предмете страницы после заголовка), и слабый
      # минус: одинаковые описания на сайте считаются признаком небрежности.
      #
      # Здесь ничего не сочиняется. Описание собирается из СОБСТВЕННОГО текста
      # страницы: её заголовок плюс первые её же фразы. Поэтому нет ни таблицы
      # из двадцати восьми строк, ни второго места, которое надо не забыть при
      # правке книги, — и сама книга не трогается вовсе. Заголовки глав — текст
      # книги, а книга заморожена; менять их можно только новой ревизией.
      #
      # Титулы обеих книг пропускаются: у них описание своё, из head.hbs.
      - name: Своё описание каждой странице
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          set -eu
          python3 - <<'PY'
          import os, re, sys, html

          PREDEL    = 230   # знаков в описании, с запасом на усечение в выдаче
          MINIMUM   = 90    # короче — оставляем запасное описание из head.hbs
          KUSOK_MIN = 40    # абзац короче считается подписью, а не текстом
          NABRANO   = 150   # набрали столько — следующий абзац уже не берём
          PROPUSK   = {'404.html', 'print.html', 'toc.html',
                       'index.html', 'title.html'}
          # Главы книги часто открываются оглядкой на предыдущую. Как первая
          # фраза в выдаче это негодно: страница представляется чужим номером.
          # Правило опирается на замер — таких описаний было двенадцать из
          # пятидесяти четырёх, — а не на предположение.
          OGLYADKA  = re.compile(r'^(Глава \d+|В главе \d+|Предыдущая глава|'
                                 r'Предыдущие главы|Прошлая глава)\b')
          MAKS_SNYAT = 2    # больше двух абзацев подряд не пропускаем

          def bez_tegov(s):
              s = re.sub(r'<[^>]+>', '', s)
              return re.sub(r'\s+', ' ', html.unescape(s)).strip()

          def vytyazhka(t):
              i = t.find('<main')
              if i < 0:
                  return None, None
              telo = t[i:t.find('</main>', i)] if '</main>' in t[i:] else t[i:]
              m = re.search(r'<h1[^>]*>(.*?)</h1>', telo, re.S)
              zagolovok = bez_tegov(m.group(1)) if m else ''
              if m:
                  telo = telo[m.end():]
              # Полоса состава главы — подпись к рисунку, а не текст.
              telo = re.sub(r'<div class="sostav".*?</div>', ' ', telo, flags=re.S)
              # Эпиграф с маркерами один на всю часть — он не про эту главу.
              telo = re.sub(r'<blockquote>(?:(?!</blockquote>).)*?Маркеры на полях'
                            r'(?:(?!</blockquote>).)*?</blockquote>', ' ', telo, flags=re.S)
              # Значки статуса — буквы Ф, М, Г, БП посреди фразы.
              telo = re.sub(r'<span class="metka[^"]*"[^>]*>.*?</span>', ' ', telo, flags=re.S)
              telo = re.sub(r'<span class="zvezda"[^>]*>.*?</span>', ' ', telo, flags=re.S)

              abzacy = [bez_tegov(p) for p in re.findall(r'<p[^>]*>(.*?)</p>', telo, re.S)]
              abzacy = [s for s in abzacy if len(s) >= KUSOK_MIN]

              def sobrat(spisok):
                  kuski = []
                  for s in spisok:
                      kuski.append(s)
                      if sum(len(k) for k in kuski) >= NABRANO:
                          break
                  return ' '.join(kuski)

              ostatok = abzacy
              snyato = 0
              while ostatok and snyato < MAKS_SNYAT and OGLYADKA.match(ostatok[0]):
                  ostatok = ostatok[1:]
                  snyato += 1
              # Снимаем оглядку только если после неё осталось из чего собрать.
              if snyato and len(sobrat(ostatok)) < MINIMUM:
                  ostatok = abzacy
                  snyato = 0
              return zagolovok, sobrat(ostatok)

          def obrezat(s, predel):
              if len(s) <= predel:
                  return s
              kusok = s[:predel]
              for znak in ('. ', '? ', '! '):
                  j = kusok.rfind(znak)
                  if j > predel * 0.5:
                      return kusok[:j + 1].strip()
              j = kusok.rfind(' ')
              return (kusok[:j] if j > 0 else kusok).rstrip(' ,;:—-') + '…'

          def postavit(t, imya, znachenie):
              rod = 'property' if imya.startswith('og:') else 'name'
              obraz = re.compile(r'(<meta %s="%s" content=")[^"]*(">)' % (rod, re.escape(imya)))
              v = znachenie.replace('&', '&amp;').replace('"', '&quot;')
              return obraz.subn(lambda m: m.group(1) + v + m.group(2), t, count=1)

          vsego = pravleno = propushcheno = korotkih = pustyh = 0
          for katalog, _, fayly in os.walk('book'):
              for f in sorted(fayly):
                  if not f.endswith('.html'):
                      continue
                  vsego += 1
                  put = os.path.join(katalog, f)
                  t = open(put, encoding='utf-8').read()

                  # mdBook ставит свой <meta name="description"> из book.toml,
                  # а там пусто. Выходило по два тега на странице, второй
                  # пустой, и какой из них возьмёт поисковик — его дело.
                  # Пустые снимаются ВЕЗДЕ и ДО подстановки: иначе порядок
                  # тегов начинает решать, в который мы попадём.
                  t, n_pust = re.subn(r'\s*<meta name="description" content="\s*">', '', t)
                  if n_pust:
                      pustyh += n_pust
                      open(put, 'w', encoding='utf-8').write(t)
                  if t.count('name="description"') > 1:
                      sys.exit('ОСТАНОВ: в %s осталось %d тегов description'
                               % (put, t.count('name="description"')))

                  if f in PROPUSK:
                      propushcheno += 1
                      continue
                  zagolovok, telo = vytyazhka(t)
                  if telo is None:
                      sys.exit('ОСТАНОВ: в %s нет <main>' % put)
                  if len(telo) < MINIMUM:
                      korotkih += 1
                      print('  коротко, оставлено прежнее описание:', put)
                      continue
                  nachalo = zagolovok + '. ' if zagolovok and not telo.startswith(zagolovok) else ''
                  opisanie = obrezat(nachalo + telo, PREDEL)
                  t, n1 = postavit(t, 'description', opisanie)
                  t, n2 = postavit(t, 'og:description', opisanie)
                  t, n3 = postavit(t, 'og:title', zagolovok or opisanie[:60])
                  if not (n1 and n2 and n3):
                      sys.exit('ОСТАНОВ: в %s не нашлось метатегов (%d/%d/%d)' % (put, n1, n2, n3))
                  open(put, 'w', encoding='utf-8').write(t)
                  # Проверяется результат, а не код возврата.
                  p = open(put, encoding='utf-8').read()
                  ozhidaem = opisanie.replace('&', '&amp;').replace('"', '&quot;')
                  if ('content="' + ozhidaem + '"') not in p:
                      sys.exit('ОСТАНОВ: описание не записано в %s' % put)
                  pravleno += 1
                  print('%-46s %s' % (os.path.relpath(put, 'book'), opisanie))

          print('страниц всего: %d, описаний поставлено: %d, пропущено служебных: %d, '
                'слишком коротких: %d, снято пустых тегов: %d'
                % (vsego, pravleno, propushcheno, korotkih, pustyh))
          if pravleno < 40:
              raise SystemExit('ОСТАНОВ: описаний поставлено %d, ожидалось не меньше сорока'
                               % pravleno)
          PY

      - name: Карта сайта и robots.txt
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          set -eu
          python3 - <<'PY'
          import os, datetime
          BAZA = 'https://nobackup.org'
          segodnya = datetime.date.today().isoformat()
          # title.html — тот же титул, что и «/». В карту идёт один адрес из двух,
          # тот, на который указывает canonical.
          PROPUSK = {'404.html', 'print.html', 'toc.html', 'title.html'}
          adresa = []
          for koren, _, fayly in os.walk('book'):
              for f in fayly:
                  if not f.endswith('.html') or f in PROPUSK:
                      continue
                  p = os.path.relpath(os.path.join(koren, f), 'book').replace(os.sep, '/')
                  if p == 'index.html':
                      p = ''
                  elif p.endswith('/index.html'):
                      p = p[:-len('index.html')]
                  adresa.append(BAZA + '/' + p)
          adresa = sorted(set(adresa))
          with open('book/sitemap.xml', 'w', encoding='utf-8') as o:
              o.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              o.write('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n')
              for a in adresa:
                  o.write('  <url><loc>%s</loc><lastmod>%s</lastmod></url>\n' % (a, segodnya))
              o.write('</urlset>\n')
          open('book/robots.txt', 'w', encoding='utf-8').write(
              'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' % BAZA)
          print('адресов в карте сайта:', len(adresa))
          # Порог, а не украшение: если mdBook однажды соберёт полкниги,
          # карта сайта сообщит об этом падением, а не тихо обеднеет.
          if len(adresa) < 40:
              raise SystemExit('ОСТАНОВ: адресов %d, ожидалось не меньше сорока' % len(adresa))
          PY

      # Яндекс.Вебмастер и Google Search Console просят положить в корень сайта
      # файл со своей меткой. Каталог book/ собирается заново при каждом прогоне,
      # а src/ вычищается нарезчиком, — поэтому файлы лежат в корне репозитория
      # и копируются сюда. Правило общее, по образцу имени: завести новую панель
      # значит положить файл в репозиторий, рабочий процесс править не надо.
      # Шаг стоит ПОСЛЕ карты сайта намеренно: это не страница книги, и в карте
      # ей не место.
      - name: Файлы подтверждения прав в поисковых панелях
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          set -eu
          n=0
          for f in yandex_*.html google*.html; do
            [ -e "$f" ] || continue
            cp "$f" book/
            test -f "book/$f" || { echo "::error::не скопирован $f"; exit 1; }
            echo "подтверждение: $f"
            n=$((n+1))
          done
          echo "файлов подтверждения: $n"

      - name: Проверка сборки
        if: steps.zenodo.outputs.propusk != 'true'
        run: |
          test -f book/index.html
          test -f book/nositeli/index.html
          test -f book/CNAME
          test ! -f book/nositeli/CNAME
          test -f book/sitemap.xml
          test -f book/robots.txt
          grep -q "Unicode" book/searcher.js
          grep -q "Unicode" book/nositeli/searcher.js
          # Титул: canonical стоит, удвоенного заголовка нет, дубля в карте нет.
          grep -q 'rel="canonical"' book/index.html
          grep -q 'rel="canonical"' book/nositeli/index.html
          ! grep -q 'rel="canonical"' book/gl-01.html
          ! grep -q '<loc>https://nobackup.org/title.html</loc>' book/sitemap.xml
          ! grep -q '<loc>https://nobackup.org/nositeli/title.html</loc>' book/sitemap.xml
          # Метки поисковых панелей — не страницы книги, в карте их быть не должно.
          ! grep -qE '<loc>[^<]*/(yandex_|google)[^<]*</loc>' book/sitemap.xml
          # Описания перестали быть одинаковыми — утверждение о содержании,
          # а не о наличии файла.
          D1=$(grep -m1 -o '<meta name="description" content="[^"]*"' book/gl-01.html)
          D2=$(grep -m1 -o '<meta name="description" content="[^"]*"' book/gl-02.html)
          test "$D1" != "$D2" \
            || { echo "::error::описания глав 1 и 2 совпали — шаг описаний не сработал"; exit 1; }
          # Тег description ровно один на странице, пустого дубля от mdBook нет.
          for F in book/index.html book/gl-01.html book/92-literatura.html book/nositeli/index.html; do
            N=$(grep -c 'name="description"' "$F")
            test "$N" = "1" || { echo "::error::в $F тегов description: $N"; exit 1; }
          done
          ! grep -rq '<meta name="description" content="">' book/
          echo "страниц большой: $(ls book/*.html | wc -l), малой: $(ls book/nositeli/*.html | wc -l)"
      - uses: actions/configure-pages@v5
        if: steps.zenodo.outputs.propusk != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.zenodo.outputs.propusk != 'true'
        with:
          path: book

  deploy:
    needs: build
    if: needs.build.outputs.propusk != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
